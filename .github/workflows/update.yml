name: Update forecast

# Once a day, shortly before the 06:30 the site is built for. The page fetches
# Open-Meteo live in the browser on every load, so this snapshot only supplies
# the instant first paint and the offline fallback — it does not need to be
# fresh to the hour. 03:20 UTC is 05:20 in Kaiserslautern in summer, 04:20 in
# winter. GitHub runs scheduled jobs on a best-effort basis and may delay them
# under load, which is fine here.
on:
  schedule:
    - cron: "20 3 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-forecast
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Fetch forecast
        run: |
          for attempt in 1 2 3; do
            if python3 scripts/update_forecast.py; then
              exit 0
            fi
            echo "attempt $attempt failed, retrying in 30s"
            sleep 30
          done
          echo "all attempts failed; keeping the previous snapshot"
          exit 1

      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/forecast.json
          if git diff --cached --quiet; then
            echo "no change"
          else
            git commit -m "Update forecast ($(date -u +'%Y-%m-%d %H:%M UTC'))"
            git push
          fi
