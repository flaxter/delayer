name: Update forecast

# Four times a day, spread across the ICON model runs (which land roughly every
# three hours). Times are UTC; Kaiserslautern is UTC+2 in summer, UTC+1 in winter.
on:
  schedule:
    - cron: "20 3,9,15,21 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-forecast
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Fetch forecast
        run: |
          for attempt in 1 2 3; do
            if python3 scripts/update_forecast.py; then
              exit 0
            fi
            echo "attempt $attempt failed, retrying in 30s"
            sleep 30
          done
          echo "all attempts failed; keeping the previous snapshot"
          exit 1

      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/forecast.json
          if git diff --cached --quiet; then
            echo "no change"
          else
            git commit -m "Update forecast ($(date -u +'%Y-%m-%d %H:%M UTC'))"
            git push
          fi
