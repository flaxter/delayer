<link rel="preconnect" href="https://fonts.googleapis.com">

<body>
<style>
  html { color-scheme: light dark; }
  body { margin: 0; font: 14px system-ui, sans-serif; }
  img { max-width: 100%; }
  [hidden] { display: none !important; }
</style>
<style>
  :root {
    --ground:      #F1F2EE;
    --surface:     #FBFBF9;
    --ink:         #191E24;
    --muted:       #616B76;
    --hair:        #D6D8D1;
    --hair-strong: #B9BCB3;
    --accent:      #A85B26;
    --rain:        #26647F;
    --rain-soft:   #CFE0E7;
    --warn:        #9A6A12;
    --alert-bg:    #F6E7D6;
    --past:        #E9EAE5;
    --shadow:      0 1px 2px rgba(25,30,36,.07);
    --display: "Frank Ruhl Libre", "Noto Serif Hebrew", "Times New Roman", serif;
    --body: "Noto Sans Hebrew", "Arial Hebrew", -apple-system, sans-serif;
    --mono: "IBM Plex Mono", "Noto Sans Hebrew", ui-monospace, Menlo, monospace;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --ground:      #14181C;
      --surface:     #1C2127;
      --ink:         #E9EAE5;
      --muted:       #98A1AB;
      --hair:        #2C333B;
      --hair-strong: #3E4650;
      --accent:      #E08A4C;
      --rain:        #74B4D2;
      --rain-soft:   #24404E;
      --warn:        #D9A93F;
      --alert-bg:    #33291A;
      --past:        #171B20;
      --shadow:      0 1px 2px rgba(0,0,0,.35);
    }
  }
  :root[data-theme="dark"] {
    --ground:      #14181C;
    --surface:     #1C2127;
    --ink:         #E9EAE5;
    --muted:       #98A1AB;
    --hair:        #2C333B;
    --hair-strong: #3E4650;
    --accent:      #E08A4C;
    --rain:        #74B4D2;
    --rain-soft:   #24404E;
    --warn:        #D9A93F;
    --alert-bg:    #33291A;
    --past:        #171B20;
    --shadow:      0 1px 2px rgba(0,0,0,.35);
  }

  * { box-sizing: border-box; }
  body {
    background: var(--ground);
    color: var(--ink);
    font-family: var(--body);
    font-size: 17px;
    line-height: 1.5;
    -webkit-font-smoothing: antialiased;
  }
  .wrap {
    max-width: 680px;
    margin: 0 auto;
    padding: 28px 20px 64px;
    display: flex;
    flex-direction: column;
    gap: 30px;
  }

  /* ---- masthead ---- */
  .masthead { display: flex; flex-direction: column; gap: 6px; }
  .place {
    font-family: var(--body);
    font-weight: 500;
    font-size: 13px;
    letter-spacing: .04em;
    color: var(--muted);
    margin: 0;
  }
  .today {
    font-family: var(--display);
    font-weight: 800;
    font-size: clamp(30px, 7.5vw, 46px);
    line-height: .98;
    letter-spacing: 0;
    margin: 0;
    text-wrap: balance;
  }
  .datenav { display: flex; align-items: center; gap: 12px; direction: ltr; }
  .datenav .today { direction: rtl; }
  .step {
    flex: none;
    width: 34px; height: 34px;
    display: grid; place-items: center;
    font-family: var(--body);
    font-size: 17px;
    color: var(--ink);
    background: var(--surface);
    border: 1px solid var(--hair-strong);
    border-radius: 50%;
    cursor: pointer;
  }
  .step:hover:not(:disabled) { border-color: var(--accent); color: var(--accent); }
  .step:disabled { opacity: .3; cursor: default; }
  .today .dow { }
  .today .dat { color: var(--muted); font-weight: 500; }
  .stamp {
    font-family: var(--mono);
    font-size: 12px;
    color: var(--muted);
    letter-spacing: .01em;
  }
  .trend {
    font-family: var(--display);
    font-weight: 700;
    font-size: 15px;
    letter-spacing: -0.01em;
    margin-top: 2px;
  }
  .trend:empty { display: none; }
  .trend.warmer { color: var(--accent); }
  .trend.colder { color: var(--rain); }
  .trend.same   { color: var(--muted); }
  .day.been .dow { opacity: .75; }
  .day.been { color: var(--muted); }

  /* ---- the four periods ---- */
  .answers {
    background: var(--surface);
    border: 1px solid var(--hair);
    border-radius: 3px;
    box-shadow: var(--shadow);
    display: flex;
    flex-direction: column;
  }
  .answer {
    display: grid;
    grid-template-columns: 92px 1fr;
    gap: 4px 18px;
    padding: 16px 22px;
  }
  .answer + .answer { border-top: 1px solid var(--hair); }
  /* Hours already gone recede; the period you are standing in leads. */
  .answer.past { background: var(--past); }
  .answer.past .call,
  .answer.past .when .name,
  .answer.past .call .kit,
  .answer.past .detail .bring { color: var(--muted); }
  .answer.past .call { font-weight: 500; }
  .answer.now { border-inline-start: 3px solid var(--accent); }
  .answer.now .when .name { color: var(--accent); }
  .answer .when {
    grid-row: span 2;
    display: flex;
    flex-direction: column;
    gap: 1px;
    padding-top: 3px;
  }
  .when .name {
    font-family: var(--body);
    font-size: 12px;
    font-weight: 700;
  }
  .when .span {
    font-family: var(--mono);
    font-size: 11px;
    color: var(--muted);
    font-variant-numeric: tabular-nums;
  }
  .answer .call {
    font-family: var(--display);
    font-weight: 700;
    font-size: clamp(19px, 4.4vw, 23px);
    line-height: 1.2;
    letter-spacing: 0;
    margin: 0;
    text-wrap: pretty;
  }
  .answer .call .kit { color: var(--accent); }
  /* Emoji ride at text size and keep their own direction run. */
  .ico { unicode-bidi: isolate; font-size: .9em; margin-inline-end: .3em; }
  /* Some garments are pictures rather than emoji; size them like a glyph. */
  .ico img { height: 1.15em; width: auto; vertical-align: -0.2em; }
  :root[dir="rtl"] .when .name { unicode-bidi: isolate-override; direction: rtl; }
  .answer .call .legs {
    color: var(--muted);
    font-weight: 500;
    font-size: .78em;
  }
  .answer .call .legs::before {
    content: "·";
    margin: 0 .45em;
    color: var(--hair-strong);
  }
  .answer.past .call .legs { color: var(--muted); }
  .answer .detail {
    font-family: var(--mono);
    font-size: 12px;
    color: var(--muted);
    font-variant-numeric: tabular-nums;
  }
  .answer .detail .bring { color: var(--rain); }

  /* ---- DWD warnings ---- */
  .warnings { display: flex; flex-direction: column; gap: 8px; }
  .warning {
    border-left: 4px solid var(--warn);
    background: var(--alert-bg);
    padding: 12px 16px;
    display: flex;
    flex-direction: column;
    gap: 3px;
  }
  .warning .wh { font-weight: 600; font-size: 16px; }
  .warning .wm { font-size: 14.5px; color: var(--muted); }

  /* ---- section head ---- */
  .sec { display: flex; flex-direction: column; gap: 12px; }
  .sec > .answers { margin-top: -2px; }
  .sec > header {
    display: flex;
    align-items: baseline;
    justify-content: space-between;
    gap: 12px;
    border-bottom: 1px solid var(--hair-strong);
    padding-bottom: 6px;
  }
  .sec > header h3 {
    font-family: var(--body);
    font-size: 13px;
    font-weight: 700;
    letter-spacing: .02em;
    margin: 0;
  }
  .sec > header .note { font-family: var(--body); font-size: 12px; color: var(--muted); }

  /* The plot is a numeric time axis: it stays left-to-right inside the RTL page. */
  .chartbox { width: 100%; overflow-x: auto; direction: ltr; }
  /* Latin digits, units and clock times inside Yiddish text keep their own run. */
  .num { unicode-bidi: isolate; direction: ltr; }
  svg.chart { display: block; width: 100%; height: auto; min-width: 460px; }

  /* ---- facts ---- */
  .facts {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 1px;
    background: var(--hair);
    border: 1px solid var(--hair);
  }
  .fact {
    background: var(--surface);
    padding: 12px 14px;
    display: flex;
    flex-direction: column;
    gap: 2px;
  }
  .fact dt {
    font-family: var(--body);
    font-size: 12px;
    color: var(--muted);
  }
  .fact dd {
    margin: 0;
    font-family: var(--display);
    font-weight: 700;
    font-size: 20px;
    letter-spacing: -0.02em;
    font-variant-numeric: tabular-nums;
  }
  .fact dd small { display: block; font-family: var(--body); font-weight: 400; font-size: 13px; color: var(--muted); letter-spacing: 0; }

  /* ---- days ---- */
  .days { display: flex; flex-direction: column; }
  .day {
    display: grid;
    grid-template-columns: 62px 1fr 106px 92px;
    align-items: center;
    gap: 12px;
    padding: 11px 2px;
    border-bottom: 1px solid var(--hair);
    font-variant-numeric: tabular-nums;
  }
  .day:last-child { border-bottom: none; }
  .day { cursor: pointer; padding-inline-start: 8px; margin-inline-start: -8px; }
  .day:hover { background: var(--past); }
  .day.sel { border-inline-start: 3px solid var(--accent); background: var(--past); }
  .day.sel .dow { color: var(--accent); }
  .day .dow { font-family: var(--mono); font-size: 12.5px; color: var(--muted); }
  .day .verdict { font-size: 15.5px; }
  .day .layers { font-family: var(--mono); font-size: 12.5px; color: var(--muted); text-align: end; }
  .day .range {
    font-family: var(--mono);
    font-size: 12.5px;
    text-align: end;
    white-space: nowrap;
  }
  .day .range .lo { color: var(--rain); }
  .day .range .hi { color: var(--accent); }

  footer.src {
    font-family: var(--mono);
    font-size: 11.5px;
    color: var(--muted);
    line-height: 1.7;
    border-top: 1px solid var(--hair);
    padding-top: 14px;
  }
  footer.src a { color: var(--muted); text-decoration: underline; text-underline-offset: 2px; }
  .lang { margin: 0; }
  .lang a {
    font-family: var(--body);
    font-size: 14px;
    color: var(--accent);
    text-decoration: underline;
    text-underline-offset: 3px;
  }
  footer.src a:hover { color: var(--ink); }
  a:focus-visible, button:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  .refresh {
    font-family: var(--body);
    font-size: 12px;
    color: var(--muted);
    background: none;
    border: 1px solid var(--hair-strong);
    border-radius: 2px;
    padding: 4px 9px;
    cursor: pointer;
  }
  .refresh:hover { color: var(--ink); border-color: var(--ink); }
  @media (max-width: 480px) {
    .answer { grid-template-columns: 78px 1fr; gap: 3px 12px; padding: 14px 15px; }
    .facts { grid-template-columns: repeat(2, 1fr); }
    .day { grid-template-columns: 58px 1fr 78px; }
    .day .verdict { font-size: 14px; }
  }
</style>

<div class="wrap">
  <div class="masthead">
    <p class="place" id="place"></p>
    <div class="datenav">

  </section>

  <section class="sec">
    <header><h3 id="knowhead"></h3></header>
    <dl class="facts" id="facts"></dl>

  <section class="sec">
    <header>
      <h3 id="weekhead"></h3>
      <button class="refresh" id="refresh" type="button"></button>
    </header>
    <div class="days" id="days"></div>
  </section>

  <footer class="src" id="src"></footer>

  <p class="lang"><a id="langlink" href="?lang=en"></a></p>
</div>

      sweaterRaincoat: "sweater + raincoat", waterproof: "warm waterproof coat",
      waterproofHatGloves: "warm waterproof coat, hat and gloves",
    },
    legs: { shorts: "shorts", trousers: "trousers" },
    bring: {
      umbrella: "☔ Bring an umbrella.",
      raincoat: "🌧️ Bring a raincoat.",
      raincoatWindy: "💨 Bring a raincoat — too windy for an umbrella.",
    },
    rainWord: "rain", dry: "☀️ dry",
    warmer: "warmer", colder: "colder",
    refYesterday: "yesterday", refToday: "today", refDayBefore: "the day before",
    cmpTxt: (deg, word, ref) => `${deg} ${word} than ${ref}`,
    sameTxt: ref => `😐 About the same as ${ref}`,
    notForecast: "Not forecast yet", beyondHorizon: "beyond the model horizon",
    noRain: "no rain forecast 🌤️", now: "now",
    facts: {
      feels7: "🌡️ Feels like, 7am", feelsPeak: "🌡️ Feels like, peak",
      rainDay: "🌧️ Rain, daylight", gusts: "💨 Gusts",
      sunrise: "🌅 Sunrise", sunset: "🌇 Sunset",
      airLow: v => `air ${v} low`, air: v => `air ${v}`,
      peakRisk: v => `${v} peak risk`, maxKmh: () => `${num("km/hr")} max`,
    },
    noConnection: "No connection", noConnectionLong: "No connection &middot; cannot fetch the forecast",
    pageError: "Something broke", pageErrorLong: "Page error &middot; ", tryAgain: "Try again",
    otherLang: "ייִדיש", otherHref: "./",
  },
};
const T = EN ? STR.en : STR.yi;
const DOW = T.dow, DOW_SHORT = T.dowShort, MONTHS = T.months;

// Latin digits inside Yiddish text need their own bidi run or they reorder.
const num = s => `<span class="num">${s}</span>`;
const CSS = getComputedStyle(document.documentElement);
const tok = n => CSS.getPropertyValue(n).trim();

/* ---------- decision logic ---------- */

// Layers you put on walking out of the door, from apparent temperature.
function layerCall(morningApp) {
  const t = morningApp;
  if (t >= 23) return { n: 0, kit: "tshirt" };
  if (t >= 15) return { n: 1, kit: "sweater" };
  if (t >= 7)  return { n: 2, kit: "sweaterJacket" };
  if (t >= 0)  return { n: 3, kit: "coat" };
  return         { n: 3, kit: "coatHatGloves" };
}

// Rain kit, from probability, accumulation and gusts across the day.
function rainCall(pmax, mm, gust) {
  if (mm >= 1.0 || pmax >= 60) {
    return gust >= 40
      ? { word: "raincoat", bring: "raincoatWindy" }
      : { word: "raincoat", bring: "raincoat" };
  }
  if (mm >= 0.2 || pmax >= 30) {
    return { word: "umbrella", bring: "umbrella" };
  }
  return { word: "dry", bring: null };
}

const fmt1 = v => (Math.round(v * 10) / 10).toFixed(1).replace(/\.0$/, "");
const r0 = v => Math.round(v);

/* ---------- shaping the raw API arrays ---------- */

function shape(data) {
  const h = data.hourly, d = data.daily;
  const hours = h.time.map((t, i) => ({
    t,
    hour: +t.slice(11, 13),
    day: t.slice(0, 10),
    temp: h.temperature_2m[i],
    app: h.apparent_temperature[i],
    mm: h.precipitation[i] ?? 0,
    prob: h.precipitation_probability[i] ?? 0,
    gust: h.wind_gusts_10m[i] ?? 0,
    wind: h.wind_speed_10m[i] ?? 0,
    cloud: h.cloud_cover[i] ?? 0,
    code: h.weather_code[i],
  })).filter(x => x.app !== null && x.temp !== null);  // past the model horizon everything is null
  const days = d.time.map((date, i) => ({
    date,
    sunrise: d.sunrise[i],
    sunset: d.sunset[i],
    appMin: d.apparent_temperature_min[i],
    appMax: d.apparent_temperature_max[i],
    tMin: d.temperature_2m_min[i],
    tMax: d.temperature_2m_max[i],
    mm: d.precipitation_sum[i],
    pmax: d.precipitation_probability_max[i] ?? 0,
    hours: hours.filter(x => x.day === date),
  }));
  return { hours, days };
}

// Everything the verdicts need for an arbitrary run of hours.
function summarize(hs) {
  if (!hs.length) return null;
  const appMin = Math.min(...hs.map(x => x.app));
  const appMax = Math.max(...hs.map(x => x.app));
  const pmax = Math.max(...hs.map(x => x.prob));
  const mm = hs.reduce((s, x) => s + x.mm, 0);
  const gust = Math.max(...hs.map(x => x.gust));
  return {
    appMin, appMax, pmax, mm, gust,
    layer: layerCall(appMin),
    rain: rainCall(pmax, mm, gust),
  };
}

// 07-12, 12-16, 16-20, then 20-07 rolling into the following morning.
const PERIODS = [
  { from: 7,  to: 12, label: "07:00-12:00" },
  { from: 12, to: 16, label: "12:00-16:00" },
  { from: 16, to: 20, label: "16:00-20:00" },
  { from: 20, to: 31, label: "20:00-07:00" },
];

// `to` may run past 24, meaning it carries into the next calendar day.
function slice(hours, date, from, to) {
  const base = new Date(date + "T00:00:00");
  const at = k => new Date(base.getTime() + k * 3600e3);
  const lo = at(from), hi = at(to);
  return hours.filter(x => {
    const t = new Date(x.t);
    return t >= lo && t < hi;
  });
}

/* ---------- rendering ---------- */

// Pictures alongside the words, for a reader who is still slow at them.
const KIT_ICON = {
  tshirt: "👕", sweater: "🧶", sweaterJacket: "🧶🧥", coat: "🧥",
  coatHatGloves: "🧥🧢🧣🧤", raincoat: "🌧️🧥", tshirtRaincoat: "👕🌧️",
  sweaterRaincoat: "🧶🌧️", waterproof: "🌧️🧥", waterproofHatGloves: "🌧️🧥🧢🧣🧤",
};
const LEG_ICON = { shorts: "🩳", trousers: "👖" };
// A few emoji are replaced by pictures (the yarn ball never read as a
// sweater; the others are just nicer drawings).
const ICON_IMG = { "🧶": "icons/hoodie.png", "🧥": "icons/coat.png", "🧢": "icons/hat.png", "☔": "icons/umbrella.svg", "🧣": "icons/scarf.svg" };
const pics = s => s.replace(/🧶|🧥|🧢|☔|🧣/gu, m => `<img src="${ICON_IMG[m]}" alt="${m}">`);
const icon = s => `<span class="ico">${pics(s)}</span>`;
// These strings start with an emoji and a space, which the glyph's advance
// width swallows; give the icon its own box so the gap survives.
const withIcon = s => s.replace(/^(\S+)\s/, (_, g) => `<span class="ico">${pics(g)}</span>`);

// Legs get their own call, on the period's warmest hour: you pick trousers or
// shorts once for the period, and the peak is what decides it.
const SHORTS_ABOVE = 22;
function legCall(appMax) {
  return appMax >= SHORTS_ABOVE ? "shorts" : "trousers";
}

// When it is properly wet, the outermost layer becomes the waterproof one —
// a sweater is the wrong answer on a rainy 18-degree day.
function withRain(layer, rain) {
  if (rain.word !== "raincoat") return layer;
  const wet = {
    tshirt: "tshirtRaincoat",
    sweater: "raincoat",
    sweaterJacket: "sweaterRaincoat",
    coat: "waterproof",
    coatHatGloves: "waterproofHatGloves",
  }[layer.kit];
  return wet ? { n: Math.max(layer.n, 1), kit: wet } : layer;
}

function line(s) {
  if (!s) return null;
  const L = withRain(s.layer, s.rain), R = s.rain;
  const lk = legCall(s.appMax);
  const legs = `<span class="legs">${icon(LEG_ICON[lk])}${T.legs[lk]}</span>`;
  const pic = icon(KIT_ICON[L.kit] || "👕");
  const words = T.kit[L.kit];
  // One layer needs no counting — a sweater obviously goes over a shirt. From
  // two up, the count is the point, so it leads.
  const call = (L.n < 2
    ? `<span class="kit">${pic}${words}</span>`
    : `${num(L.n)} ${T.layer(L.n)} ${T.arrow} <span class="kit">${pic}${words}</span>`) + legs;
  // The raincoat is already named in the verdict; do not say it twice.
  const bring = R.bring && R.word !== "raincoat" ? ` <span class="bring">${withIcon(T.bring[R.bring])}</span>` : "";
  return { call, detail: `${num(r0(s.appMin) + "-" + r0(s.appMax) + "&deg;C")} &middot; ${withIcon("🌧️ ")}${num(s.pmax + "%")} ${T.rainWord}, ${num(fmt1(s.mm) + " mm")}${bring}` };
}

// Peak daylight feels-like against the day before — the comparison people
// actually make when they open the curtains.
function renderTrend(today, before, offset) {
  const el = document.getElementById("trend");
  if (!today || !before) { el.textContent = ""; el.className = "trend"; return; }
  const d = today.appMax - before.appMax;
  // The day being compared against is the one before the one on screen.
  const ref = offset === 0 ? T.refYesterday : offset === 1 ? T.refToday : T.refDayBefore;
  const mag = Math.abs(d);
  if (mag < 1.5) {
    el.className = "trend same";
    el.innerHTML = withIcon(T.sameTxt(ref));
    return;
  }
  el.className = "trend " + (d > 0 ? "warmer" : "colder");
  el.innerHTML = icon(d > 0 ? "🔥" : "❄️") + T.cmpTxt(num(r0(mag) + "&deg;"), d > 0 ? T.warmer : T.colder, ref);
}

function renderAnswers(hours, date, isToday) {
  const now = isToday ? new Date() : new Date(0);
  const base = new Date(date + "T00:00:00").getTime();
  document.getElementById("answers").innerHTML = PERIODS.map((pd, i) => {
    const s = summarize(slice(hours, date, pd.from, pd.to));
    const l = line(s);
    if (!l) return `<div class="answer past">
      <div class="when"><span class="name">${withIcon(T.periods[i])}</span><span class="span">${num(pd.label)}</span></div>
      <p class="call">${T.notForecast}</p>
      <span class="detail">${T.beyondHorizon}</span>
    </div>`;
    const startsAt = base + pd.from * 3600e3, endsAt = base + pd.to * 3600e3;
    const state = now >= endsAt ? " past" : (now >= startsAt ? " now" : "");
    return `<div class="answer${state}">
      <div class="when"><span class="name">${withIcon(T.periods[i])}</span><span class="span">${num(pd.label)}</span></div>
      <p class="call">${l.call}</p>
      <span class="detail">${l.detail}</span>
    </div>`;
  }).join("");
}

function renderWarnings(alerts) {
  const el = document.getElementById("warnings");
  if (!alerts || !alerts.length) { el.innerHTML = ""; return; }
  el.innerHTML = alerts.map(a => `
    <div class="warning">
      <div class="wh">${a.event_de || a.event_en || "DWD-Warnung"}${a.severity ? ` — ${a.severity}` : ""}</div>
      <div class="wm">${(a.headline_de || a.headline_en || "").replace(/</g, "&lt;")}</div>
    </div>`).join("");
}

function renderChart(allHours, day, isToday) {
  const svg = document.getElementById("chart");
  // 05:00 through 07:00 the next morning, so the plot covers the same span as
  // the four period rows above it — the overnight row runs past midnight.
  const hours = slice(allHours, day.date, 5, 31);
  if (!hours.length) return;

  const W = 640, H = 226;
  const L = 34, R = 12, TOP = 16, tempH = 124, barsTop = 158, barsH = 44;
  const innerW = W - L - R;
  const x = i => L + (innerW * i) / (hours.length - 1);

  const temps = hours.map(h => h.app);
  let lo = Math.min(...temps), hi = Math.max(...temps);
  const pad = Math.max(1.5, (hi - lo) * 0.18);
  lo = Math.floor(lo - pad); hi = Math.ceil(hi + pad);
  const y = v => TOP + tempH - ((v - lo) / (hi - lo)) * tempH;

  const ink = tok("--ink"), muted = tok("--muted"), hair = tok("--hair");
  const accent = tok("--accent"), rain = tok("--rain"), rainSoft = tok("--rain-soft");
  const hairStrong = tok("--hair-strong");
  const nowMs = Date.now();

  let s = "";

  // temperature gridlines, labelled at values the line actually reaches
  const step = (hi - lo) > 14 ? 5 : (hi - lo) > 7 ? 2 : 1;
  for (let v = Math.ceil(lo / step) * step; v <= hi; v += step) {
    s += `<line x1="${L}" y1="${y(v).toFixed(1)}" x2="${W - R}" y2="${y(v).toFixed(1)}" stroke="${hair}" stroke-width="1"/>`;
    s += `<text x="${L - 7}" y="${(y(v) + 3.5).toFixed(1)}" text-anchor="end" fill="${muted}" font-family="IBM Plex Mono, monospace" font-size="10">${v}&#176;</text>`;
  }

  // Rain probability, in its own panel with its own scale. Anything under 5%
  // is not drawn: a row of 2-pixel stubs across a dry day reads as a broken
  // axis, not as "no rain".
  const dayMax = Math.max(...hours.map(h => h.prob));
  s += `<rect x="${L}" y="${barsTop}" width="${innerW}" height="${barsH}" fill="${rainSoft}" opacity="0.5" rx="2"/>`;

  if (dayMax < 5) {
    s += `<text x="${L + innerW / 2}" y="${barsTop + barsH / 2 + 4}" text-anchor="middle" fill="${muted}" font-family="Noto Sans Hebrew, sans-serif" font-size="12">${T.noRain}</text>`;
  } else {
    for (const pct of [50, 100]) {
      const gy = barsTop + barsH - (pct / 100) * barsH;
      s += `<line x1="${L}" y1="${gy.toFixed(1)}" x2="${W - R}" y2="${gy.toFixed(1)}" stroke="${hair}" stroke-width="1" stroke-dasharray="2 3"/>`;
      s += `<text x="${L - 7}" y="${(gy + 3.5).toFixed(1)}" text-anchor="end" fill="${muted}" font-family="IBM Plex Mono, monospace" font-size="10">${pct}${pct === 100 ? "%" : ""}</text>`;
    }
    const bw = Math.max(6, innerW / hours.length - 3);
    hours.forEach((h, i) => {
      if (h.prob < 5) return;
      const bh = (h.prob / 100) * barsH;
      const gone = new Date(h.t).getTime() < nowMs;
      s += `<rect x="${(x(i) - bw / 2).toFixed(1)}" y="${(barsTop + barsH - bh).toFixed(1)}" width="${bw.toFixed(1)}" height="${bh.toFixed(1)}" fill="${gone ? muted : rain}" opacity="${gone ? 0.35 : 0.9}" rx="1"/>`;
    });
  }

  // the out-of-the-house band, 7am to 7pm
  const iStart = hours.findIndex(h => h.hour === 7);
  const iEnd = hours.findIndex(h => h.hour === 19 && h.day === day.date);
  if (iStart >= 0 && iEnd > iStart) {
    s += `<rect x="${x(iStart).toFixed(1)}" y="${TOP}" width="${(x(iEnd) - x(iStart)).toFixed(1)}" height="${tempH}" fill="${accent}" opacity="0.06"/>`;
  }

  // Apparent temperature. What has already happened is drawn back in the
  // neutral; the forecast ahead of now carries the accent.
  const split = isToday ? hours.findIndex(h => new Date(h.t).getTime() >= nowMs) : 0;
  const pt = (h, i) => `${x(i).toFixed(1)},${y(h.app).toFixed(1)}`;
  if (split > 0) {
    const past = hours.slice(0, split + 1).map((h, i) => pt(h, i)).join(" ");
    s += `<polyline points="${past}" fill="none" stroke="${muted}" stroke-width="1.75" stroke-linejoin="round" stroke-linecap="round" opacity="0.55"/>`;
  }
  const from = split < 0 ? 0 : split;
  const ahead = hours.slice(from).map((h, i) => pt(h, i + from)).join(" ");
  s += `<polyline points="${ahead}" fill="none" stroke="${accent}" stroke-width="2.25" stroke-linejoin="round" stroke-linecap="round"/>`;

  // midnight, where the plot moves into the next calendar day
  const mid = hours.findIndex(h => h.hour === 0);
  if (mid > 0) {
    s += `<line x1="${x(mid).toFixed(1)}" y1="${TOP}" x2="${x(mid).toFixed(1)}" y2="${barsTop + barsH}" stroke="${hairStrong}" stroke-width="1"/>`;
  }

  // hour axis + now marker
  hours.forEach((h, i) => {
    if (h.hour % 3 === 0) {
      s += `<text x="${x(i).toFixed(1)}" y="${H - 4}" text-anchor="middle" fill="${muted}" font-family="IBM Plex Mono, monospace" font-size="10">${String(h.hour).padStart(2, "0")}</text>`;
    }
  });
  const ni = isToday ? hours.findIndex((h, i) =>
    new Date(h.t).getTime() <= nowMs &&
    (i === hours.length - 1 || new Date(hours[i + 1].t).getTime() > nowMs)) : -1;
  if (ni >= 0) {
    s += `<line x1="${x(ni).toFixed(1)}" y1="${TOP - 6}" x2="${x(ni).toFixed(1)}" y2="${barsTop + barsH}" stroke="${ink}" stroke-width="1" stroke-dasharray="2 3" opacity="0.55"/>`;
    s += `<circle cx="${x(ni).toFixed(1)}" cy="${y(hours[ni].app).toFixed(1)}" r="4" fill="${accent}" stroke="${tok("--surface")}" stroke-width="2"/>`;
    s += `<text x="${x(ni).toFixed(1)}" y="${TOP - 10}" text-anchor="middle" fill="${ink}" font-family="Noto Sans Hebrew, sans-serif" font-size="11">${T.now} ${fmt1(hours[ni].app)}&#176;</text>`;
  }

  svg.innerHTML = s;
}

function renderFacts(day, a) {
  const rise = day.sunrise.slice(11, 16), set = day.sunset.slice(11, 16);
  const items = [
    [T.facts.feels7,   num(fmt1(a.appMin) + "&deg;"), T.facts.airLow(num(fmt1(day.tMin) + "&deg;"))],
    [T.facts.feelsPeak, num(fmt1(a.appMax) + "&deg;"), T.facts.air(num(fmt1(day.tMax) + "&deg;"))],
    [T.facts.rainDay,   num(fmt1(a.mm) + "&nbsp;mm"), T.facts.peakRisk(num(a.pmax + "%"))],
    [T.facts.gusts,     num(r0(a.gust)), T.facts.maxKmh()],
    [T.facts.sunrise,   num(rise), "&nbsp;"],
    [T.facts.sunset,    num(set), "&nbsp;"],
  ];
  document.getElementById("facts").innerHTML = items.map(([k, v, sub]) =>
    `<div class="fact"><dt>${withIcon(k)}</dt><dd>${v} <small>${sub}</small></dd></div>`).join("");
}

// Daylight hours only — a wet night should not make a dry day read as "raincoat".
function renderDays(days, hours, sel, t0) {
  const first = 0;
  const list = days.slice(first, lastUsableDay(hours, days, t0) + 1);
  document.getElementById("days").innerHTML = list.map((d, k) => {
    const i = first + k;
    const a = summarize(slice(hours, d.date, 7, 20)) || summarize(d.hours);
    if (!a) return "";
    const dt = new Date(d.date + "T12:00:00");
    const kit = withRain(a.layer, a.rain);
    return `<div class="day${i === sel ? " sel" : ""}${i < t0 ? " been" : ""}" data-i="${i}" role="button" tabindex="0">
      <span class="dow">${i === t0 ? T.today : DOW_SHORT[dt.getDay()] + " " + num(dt.getDate())}</span>
      <span class="verdict">${(kit.n < 2 ? "" : num(kit.n) + " " + T.arrow + " ") + icon(KIT_ICON[kit.kit] || "👕") + T.kit[kit.kit]}</span>
      <span class="layers">${a.rain.word === "dry" ? withIcon(T.dry) : withIcon("🌧️ ") + num(a.pmax + "%")}</span>
      <span class="range num"><span class="lo">${r0(a.appMin)}&deg;</span> ${T.arrow} <span class="hi">${r0(a.appMax)}&deg;</span></span>
    </div>`;
  }).join("");
}

// The day array spans backcast and forecast, so "today" sits in the middle of
// it. VIEW.sel is an absolute index; everything user-facing is expressed as an
// offset from today.
const HORIZON = 7;
let VIEW = { data: null, sel: null };

function todayIndex(days) {
  const today = new Date();
  const iso = `${today.getFullYear()}-${String(today.getMonth() + 1).padStart(2, "0")}-${String(today.getDate()).padStart(2, "0")}`;
  const i = days.findIndex(d => d.date === iso);
  return i < 0 ? 0 : i;
}

// The ICON blend reaches a little over seven days; stop where the data does.
function lastUsableDay(hours, days, from) {
  let last = from;
  for (let i = from; i <= Math.min(from + HORIZON, days.length - 1); i++) {
    if (slice(hours, days[i].date, 7, 20).length) last = i;
  }
  return last;
}

function dayLabel(offset) {
  if (offset === 0) return T.today;
  if (offset === 1) return T.tomorrow;
  if (offset === -1) return T.yesterday;
  return offset > 0 ? T.inDays(offset) : T.daysAgo(-offset);
}

function stamp(dateISO, sel) {
  const day = new Date(dateISO + "T12:00:00");
  document.getElementById("today").innerHTML =
    `<span class="dow">${DOW[day.getDay()]}</span> ` +
    `<span class="dat"><span class="num">${day.getDate()}</span> ${MONTHS[day.getMonth()]}</span>`;
  document.getElementById("stamp").innerHTML = `${dayLabel(sel)} &middot; ${T.pulled}`;
  document.getElementById("wearhead").innerHTML =
    withIcon("👕 " + (sel === 0 ? T.wearToday : sel < 0 ? T.wearPast : T.wear));
}

function paint(data, alerts) {
  if (data) VIEW.data = data;
  if (!VIEW.data) return;
  const { hours, days } = shape(VIEW.data);
  const t0 = todayIndex(days);
  const last = lastUsableDay(hours, days, t0);
  if (VIEW.sel === null) VIEW.sel = t0;
  VIEW.sel = Math.max(0, Math.min(VIEW.sel, last));
  const day = days[VIEW.sel];
  const isToday = VIEW.sel === t0;
  const daylight = summarize(slice(hours, day.date, 7, 20)) || summarize(day.hours);
  const before = VIEW.sel > 0 ? summarize(slice(hours, days[VIEW.sel - 1].date, 7, 20)) : null;

  stamp(day.date, VIEW.sel - t0);
  renderTrend(daylight, before, VIEW.sel - t0);
  renderAnswers(hours, day.date, isToday);
  renderChart(hours, day, isToday);
  renderFacts(day, daylight);
  renderDays(days, hours, VIEW.sel, t0);

  document.getElementById("prev").disabled = VIEW.sel === 0;
  document.getElementById("next").disabled = VIEW.sel >= last;
  if (alerts !== undefined) renderWarnings(alerts);
}

function go(i) { VIEW.sel = i; paint(); window.scrollTo({ top: 0, behavior: "smooth" }); }

/* ---------- static text ---------- */

    דער מאָדעל לױפֿט יעדע דרײַ שעה; דער בלאַט ציט די פֿרישסטע דאַטן יעדעס מאָל װאָס מען עפֿנט אים.
    װאָרענונגען: אַמטלעכע DWD־װאָרענונגען פֿאַר קײַזערסלאַוטערן־שטאָט (<span class="num">707312001</span>)
    דורך <a href="https://brightsky.dev/">Bright Sky</a>.
    די שיכטן־ און שירעם־עצות װערן אױסגערעכנט פֿון דער געפֿילטער טעמפּעראַטור, דעם שעהלעכן שאַנס אױף רעגן,
    די מיליִמעטערס און די װינטן &mdash; דער חשבון שטײט אױבן, איר קענט אים איבערפּסקענען.`,
  en: `Forecast: DWD ICON-D2 / ICON-EU via <a href="https://open-meteo.com/">Open-Meteo</a>.
    The model runs every three hours; this page pulls the freshest data every time you open it.
    Warnings: official DWD warnings for the Kaiserslautern-Stadt warn cell
    (<span class="num">707312001</span>) via <a href="https://brightsky.dev/">Bright Sky</a>.
    The layer and umbrella calls are computed from apparent temperature, hourly rain probability,
    accumulated millimetres and gusts &mdash; the reasoning is printed above, so you can overrule it.`,
};

function chrome() {
  document.getElementById("place").textContent = T.place;
  document.getElementById("prev").setAttribute("aria-label", T.prevAria);
  document.getElementById("next").setAttribute("aria-label", T.nextAria);
  document.getElementById("feelsnote").textContent = T.feelsNote;
  document.getElementById("charthead").textContent = "📈 " + T.hourByHour;
  document.getElementById("chartnote").textContent = T.chartNote;
  document.getElementById("knowhead").textContent = "💡 " + T.worthKnowing;
  document.getElementById("weekhead").textContent = "📅 " + T.weekAhead;
  document.getElementById("refresh").textContent = T.refresh;
  document.getElementById("src").innerHTML = EN ? FOOTER.en : FOOTER.yi;
  const link = document.getElementById("langlink");
  link.textContent = T.otherLang;
  link.href = T.otherHref;
  document.title = EN ? "Delayer" : "Delayer";
}
chrome();

/* ---------- boot ---------- */

const FORECAST_URL = "https://api.open-meteo.com/v1/forecast?latitude=" + LAT + "&longitude=" + LON +
  "&hourly=temperature_2m,apparent_temperature,precipitation,precipitation_probability,weather_code,wind_speed_10m,wind_gusts_10m,cloud_cover,relative_humidity_2m" +
  "&daily=sunrise,sunset,temperature_2m_min,temperature_2m_max,apparent_temperature_min,apparent_temperature_max,precipitation_sum,precipitation_probability_max,weather_code" +
  "&models=icon_seamless&timezone=Europe%2FBerlin&past_days=5&forecast_days=9";
const ALERT_URL = "https://api.brightsky.dev/alerts?lat=" + LAT + "&lon=" + LON;

async function refresh() {
  const btn = document.getElementById("refresh");
  btn.textContent = T.refreshing;
  try {
    const [f, al] = await Promise.all([
      fetch(FORECAST_URL).then(r => r.json()),
      fetch(ALERT_URL).then(r => r.json()).catch(() => ({ alerts: [] })),
    ]);
    paint(f, al.alerts || []);
  } catch (e) {
    // Only a failed request is a connection problem; anything else is a fault in
    // this page and must not be dressed up as one.
    const offline = e instanceof TypeError || !navigator.onLine;
    console.error("delayer:", e);
    document.getElementById("stamp").innerHTML = offline
      ? T.noConnectionLong : T.pageErrorLong + e.message;
    document.getElementById("trend").textContent = "";
    if (!VIEW.data) document.getElementById("answers").innerHTML =
      `<div class="answer"><div class="when"><span class="name">🚫</span></div>` +
      `<p class="call">${offline ? T.noConnection : T.pageError}</p>` +
      `<span class="detail">${T.tryAgain}</span></div>`;
  }
  btn.textContent = T.refresh;
}

document.getElementById("prev").addEventListener("click", () => go(VIEW.sel - 1));
document.getElementById("next").addEventListener("click", () => go(VIEW.sel + 1));
document.getElementById("days").addEventListener("click", e => {
  const row = e.target.closest(".day");
  if (row) go(+row.dataset.i);
});
document.getElementById("days").addEventListener("keydown", e => {
  const row = e.target.closest(".day");
  if (row && (e.key === "Enter" || e.key === " ")) { e.preventDefault(); go(+row.dataset.i); }
});
document.addEventListener("keydown", e => {
  if (e.target.matches("input, textarea")) return;
  // Arrow keys follow the buttons: left goes back a day, right goes forward.
  if (e.key === "ArrowLeft" && VIEW.sel > 0) go(VIEW.sel - 1);
  if (e.key === "ArrowRight") go(VIEW.sel + 1);
});
document.getElementById("refresh").addEventListener("click", refresh);
refresh();
// A forecast fetched at 6:30 is stale by lunchtime; pick up the new run on return.
document.addEventListener("visibilitychange", () => { if (!document.hidden) refresh(); });
</script>
</body>
</html>
